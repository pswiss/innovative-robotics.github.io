name: Update publications from Google Scholar

on:
  schedule:
    - cron: "0 9 * * 1"        # every Monday, 09:00 UTC
  workflow_dispatch:            # "Run workflow" button in the Actions tab
  push:
    paths:
      - "data/site.csv"         # re-run when you edit members / Scholar links

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scholarly
        run: pip install scholarly

      - name: Fetch publications
        run: python scripts/update_publications.py
        continue-on-error: true   # if Scholar blocks us, keep the previous list

      - name: Commit changes
        run: |
          if [[ -n "$(git status --porcelain data/publications.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/publications.json
            git commit -m "Update publications from Google Scholar"
            git push
          else
            echo "No changes."
          fi
